name: SudenMind CI (LCCC-base + Conda)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        # 1. 先用 Conda 安装 PyTorch (CPU版比较快)
        conda install -y pytorch cpuonly -c pytorch
        # 2. 安装 transformers 和 datasets 库
        pip install transformers datasets flake8 pytest

    - name: Lint with flake8
      run: |
        # 语法错误检查
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test LCCC Dataset Loading
      run: |
        # 测试LCCC数据集加载
        python -c "
from datasets import load_dataset
print('测试LCCC数据集加载...')
dataset = load_dataset('lccc', 'base', split='train[:10]')
print(f'✓ LCCC数据集加载成功，样本数: {len(dataset)}')
print(f'  数据集特征: {list(dataset.features.keys())}')
if len(dataset) > 0:
    sample = dataset[0]
    print(f'  样本对话长度: {len(sample[\"dialog\"])}')
    print(f'  第一句话: {sample[\"dialog\"][0][:50]}...')
print('LCCC数据集测试通过！')
        "

    - name: Test Model Architecture
      run: |
        # 验证模型初始化和前向传播
        python -c "
import torch
from model import SudenMind
print('测试模型架构...')
# BERT中文词表大小
vocab_size = 21128
model = SudenMind(
    vocab_size=vocab_size,
    embedding_dim=256,
    hidden_dim=512,
    output_dim=vocab_size,
    bert_model_name='bert-base-chinese',
    freeze_bert=True,
    num_experts=4,
    top_k=2,
    aux_loss_coef=0.01
)
print(f'✓ 模型创建成功')
print(f'  总参数: {sum(p.numel() for p in model.parameters()):,}')
print(f'  可训练参数: {sum(p.numel() for p in model.parameters() if p.requires_grad):,}')

# 测试前向传播
batch_size = 2
seq_len = 50
test_input = torch.randint(100, 1000, (batch_size, seq_len))
with torch.no_grad():
    output = model(test_input)
print(f'✓ 前向传播测试通过')
print(f'  输入形状: {test_input.shape}')
print(f'  输出形状: {output.shape}')
print('模型测试通过！')
        "

    - name: Test Dataset Classes
      run: |
        # 测试数据集类
        python -c "
from data_utils import LCCCDataset
from transformers import BertTokenizer
print('测试LCCCDataset类...')
tokenizer = BertTokenizer.from_pretrained('bert-base-chinese')
dataset = LCCCDataset(
    split='train',
    config='base',
    max_history=5,
    max_length=128,
    tokenizer_name='bert-base-chinese',
    test_mode=True
)
print(f'✓ LCCCDataset创建成功，大小: {len(dataset)}')
if len(dataset) > 0:
    sample = dataset[0]
    print(f'  样本输入形状: {sample[\"input_ids\"].shape}')
    print(f'  样本标签形状: {sample[\"labels\"].shape}')
print('数据集类测试通过！')
        "
