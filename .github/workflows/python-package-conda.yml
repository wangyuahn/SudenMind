name: SudenMind CI (Conda + Pip)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        # 1. 先用 Conda 安装 PyTorch (CPU版比较快)
        conda install -y pytorch cpuonly -c pytorch
        # 2. 必须用 pip 安装 jieba
        pip install jieba flake8 pytest

    - name: Lint with flake8
      run: |
        # 语法错误检查，针对你重构后的代码进行静态扫描
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Preprocessing & Model Architecture
      run: |
        # 创建临时测试语料，验证 process.py 是否能跑通
        mkdir -p data
        echo -e "你好\t你好呀" > data/corpus.txt
        python process.py
        
        # 验证模型初始化和前向传播（Dummy Input）
        # 确保重构后的维度对齐没有问题
        python -c "import torch; from model import SudenMind; m = SudenMind(100, 256, 512, 100); x = torch.randint(0, 100, (10, 2)); out = m(x); print('Model check passed!')"
